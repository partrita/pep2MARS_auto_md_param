[workspace]
authors = ["deepthought <deepthough@postech.ac.kr>"]
channels = ["conda-forge"]
name = "pep2MARS_auto_md_param"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
build = "python 1_build_system.py"
caps = "python 2_prepare_pep_caps.py"
fit = "python 4_fit_pep_chgs.py"
atomic-charge = { cmd = "python resp_calc/atomic_charge_fitting.py", environment = "p4dev" }
pep2mars = "bash 0_pep2mars.sh"

[dependencies]
python = "3.10.*"
rdkit = ">=2026.3.6,<2027"
biopython = ">=1.88,<2"
pandas = ">=2.3.3,<3"
numpy = ">=2.2.6,<3"
scipy = ">=1.15.2,<2"
scikit-learn = ">=1.7.2,<2"
mdanalysis = ">=2.9.0,<3"
pymol-open-source = ">=3.1.0,<4"
nodejs = ">=26.10.0,<26.11"
oss2 = ">=2.19.0,<3"
gevent = ">=26.8.0,<27"
markupsafe = ">=3.0.3,<4"
certifi = ">=2026.7.22,<2027"

[feature.p4dev.dependencies]
python = "3.10.*"
psi4 = "*"
resp = "*"
rdkit = "*"

[environments]
p4dev = { features = ["p4dev"], no-default-feature = true }
